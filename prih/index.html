<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prih — EQ Playground</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">Prih<span>EQ Playground · 711</span></div>
  <div class="topbtns">
    <button id="btnAvg">Average All</button>
    <button id="btnShot">Screenshot</button>
    <button id="btnUrl">Copy URL</button>
    <button id="btnTheme" title="Переключить тему">☀</button>
  </div>
</header>
<main>
  <aside id="left">
    <input id="search" type="search" placeholder="Поиск наушников…">
    <div id="hplist"></div>
  </aside>

  <section id="center">
    <canvas id="graph"></canvas>
    <div id="legend"></div>
  </section>

  <aside id="right">
    <h3>Таргет</h3>
    <select id="targetSel"></select>

    <h3>Preference adjustments</h3>
    <div id="prefsPanel">
      <label>Bass shelf (105 Гц)
        <span class="row"><input type="range" id="bassR" min="-10" max="10" step="0.5" value="0"><output id="bassO">0.0 дБ</output></span>
      </label>
      <label>Tilt (дБ/окт)
        <span class="row"><input type="range" id="tiltR" min="-1" max="1" step="0.05" value="0"><output id="tiltO">0.00</output></span>
      </label>
      <label>Treble shelf (10 кГц)
        <span class="row"><input type="range" id="trebR" min="-10" max="10" step="0.5" value="0"><output id="trebO">0.0 дБ</output></span>
      </label>
      <button id="prefsReset">Сброс</button>
      <div id="prefsNote" class="muted"></div>
    </div>

    <h3>График</h3>
    <label class="chk"><input type="checkbox" id="normChk" checked> Нормализация (500–2000 Гц)</label>
    <label>Сглаживание
      <select id="smoothSel">
        <option value="off">выкл</option>
        <option value="1/12">1/12 окт</option>
        <option value="1/6">1/6 окт</option>
        <option value="1/3" selected>1/3 окт</option>
        <option value="1">1 окт</option>
      </select>
    </label>

    <h3>Auto EQ</h3>
    <div class="grid2">
      <label>Фильтров<input type="number" id="aeCount" value="8" min="1" max="30"></label>
      <label>F min, Гц<input type="number" id="aeFmin" value="20"></label>
      <label>F max, Гц<input type="number" id="aeFmax" value="8000"></label>
      <label>Gain min, дБ<input type="number" id="aeGmin" value="-10"></label>
      <label>Gain max, дБ<input type="number" id="aeGmax" value="6"></label>
      <label>Q min<input type="number" id="aeQmin" value="0.1" step="0.1"></label>
      <label>Q max<input type="number" id="aeQmax" value="1.5" step="0.1"></label>
    </div>
    <label class="chk"><input type="checkbox" id="eqShowChk" checked> Показывать результат EQ</label>
    <div class="row">
      <button id="btnEq">Применить</button>
      <button id="btnCopyEq" disabled>Копировать</button>
    </div>
    <table id="eqTable"></table>
  </aside>
</main>
<div id="toast"></div>
<script src="config.js"></script>
<script src="prih.js"></script>
</body>
</html>
