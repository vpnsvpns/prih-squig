name: parse-squig
on:
  schedule:
    - cron: "0 * * * *"   # каждый час
  workflow_dispatch:       # ручной запуск из вкладки Actions
permissions:
  contents: write
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse squig links
        run: python tools/parse_squig.py
      - name: Commit updates
        run: |
          git config user.name "squig-parser"
          git config user.email "parser@users.noreply.github.com"
          git add data/squig-db.json
          git diff --cached --quiet || { git commit -m "auto: hourly squig parse $(date -u +%FT%TZ)"; git push; }
