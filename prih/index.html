<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prih — EQ Playground</title>
<style>
:root{--bg:#1b1a20;--panel:#211f27;--panel2:#2a2831;--line:#3a3742;--text:#e8e6ea;--muted:#9b97a4;--target:#c9c2b4;--eq:#d9c223;--grid:#2e2c35}
body.light{--bg:#f1f0f4;--panel:#e7e6ec;--panel2:#dfdfe6;--line:#c9c8d4;--text:#1c1b22;--muted:#66646f;--grid:#d4d3dc}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
#errbar{display:none;background:#8a1f1f;color:#fff;padding:8px 14px;font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font:14px system-ui;z-index:50;letter-spacing:.05em}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-size:20px;font-weight:800;font-style:italic}
.logo span{margin-left:10px;font-size:11px;font-weight:400;font-style:normal;color:var(--muted)}
button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px}
button:hover{border-color:var(--muted)}
button.accent{background:#fff;color:#111;border-color:#fff;font-weight:600}
button:disabled{opacity:.4;cursor:default}
main{flex:1;display:flex;min-height:0}
aside{width:310px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:4px;padding:8px 8px 0}
.tabs button{flex:1;padding:6px 4px;font-size:12px}
.tabs button.on{background:#fff;color:#111;border-color:#fff;font-weight:600}
#search{margin:8px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 10px;font-size:12px}
.pane{flex:1;overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
.brand,.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 9px;border-radius:6px;cursor:pointer;font-size:12.5px}
.brand:hover,.mrow:hover{background:var(--panel2)}
.brand.sel{background:#fff;color:#111}
.mrow.sel{background:rgba(255,255,255,.12);outline:1px solid var(--muted)}
.mrow .src,.brand .cnt{color:var(--muted);font-size:10.5px;flex:none}
.brand.sel .cnt{color:#333}
.mrow .add{padding:1px 8px;border-radius:5px}
#eqPane h3{margin:6px 0 0;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
label.chk{flex-direction:row;align-items:center;gap:7px;color:var(--text);font-size:12px}
input[type=number],input[type=search],input[type=text],select{background:var(--bg);border:1px solid var(--line);color:var(--text);
